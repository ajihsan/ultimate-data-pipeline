# conduit bus CDC: postgres app_users -> redpanda pg_changes.
#
# Source: builtin postgres connector, snapshot then logical replication. The
# slot/publication pair and the badger checkpoint resume without a new snapshot.
# Destination: builtin kafka connector, OpenCDC json records; the `cdc` connect
# pipeline lands them in ClickHouse. `pg_changes` must have one partition.
# Field names verified against the v0.20.0 docs and the running stack, 2026-10-13.

version: 2.2
pipelines:
  - id: pg-cdc
    status: running
    description: postgres app_users snapshot + WAL CDC → kafka topic pg_changes
    connectors:
      - id: pg-src
        type: source
        plugin: builtin:postgres
        settings:
          # Conduit expands ${VAR} in pipeline configs. Compose builds
          # POSTGRES_DSN from POSTGRES_*; no credential lives in this file.
          url: ${POSTGRES_DSN}
          tables: app_users
          cdcMode: logrepl
          snapshotMode: initial
          logrepl.publicationName: conduitpub
          logrepl.slotName: conduitslot
          # The default (true) attaches an avro schema to every record; DELETE
          # records then fail to encode — the partial before-payload ({id} only,
          # default replica identity) can't marshal against the full-table
          # schema ("created_at: *avro.null is unsupported for Avro long") and
          # the pipeline degrades. We consume plain OpenCDC structured data, so
          # schemas are off (verified 2026-10-13 on v0.20.0 / pg source v0.14.2).
          logrepl.withAvroSchema: false
      - id: kafka-dst
        type: destination
        plugin: builtin:kafka
        settings:
          servers: redpanda:29092
          topic: pg_changes
