# notify pipeline: fast_decisions + model_decisions → udp.alerts + delivery.
#
# QUALIFY — model: escalate_probability ≥ THRESHOLD_ESCALATE_P (default 0.75)
# or scam_probability ≥ THRESHOLD_SCAM_P (default 0.35). Fast: category ==
# scam_report and confidence ≥ 0.85. Degraded model rows never qualify.
#
# DEDUPE — the alerts row is the dedupe record: count() on udp.alerts WHERE
# decision_id = ?; a hit drops the message. The fast path uses
# fast:<event_id>; the model path uses model:<event_id>. Both keys come from
# the ticket, so a crash replay reuses the key. No RAM dedupe cache: a cache
# hit after a failed insert would lose the alert.
#
# RATE LIMIT — ALERT_RATE_LIMIT_PER_MIN (default 10) delivered alerts per
# epoch minute. Over-limit alerts are recorded with suppressed=true. A ttlru
# cache holds the minute counter; threads 1 serializes counter + dedupe; a
# counter failure fails open; a restart re-arms the window (durable dedupe
# still prevents duplicate rows).
#
# DELIVERY — the alerts row is always written. NOTIFY_PROVIDER (comma list)
# fans out: log (default, no HTTP) | mock | telegram | discord. Failed POSTs
# retry (3s, 2 retries, backoff 429/503), then log
# notify_delivery_failed_total; the row still lands. Delivery is at-least-once.
# The channel column records log | mock | telegram | discord | telegram,discord.
# One worker also serializes delivery, so a slow provider delays later alerts.
#
# Invalid decisions are dropped, logged, and counted in notify_dropped_total.
# Health: GET :4195/ping; metrics: :4195/metrics.

http:
  address: 0.0.0.0:4195

cache_resources:
  - label: rate_window
    ttlru:
      default_ttl: 600s

input:
  broker:
    inputs:
      # checkpoint_limit 1024 bounds restart redelivery to ~10s of traffic;
      # the durable dedupe makes every replay a no-op.
      - kafka_franz:
          seed_brokers:
            - redpanda:29092
          topics:
            - fast_decisions
          consumer_group: udp-notify-fast
          start_from_oldest: true
          checkpoint_limit: 1024
      - kafka_franz:
          seed_brokers:
            - redpanda:29092
          topics:
            - model_decisions
          consumer_group: udp-notify-model
          start_from_oldest: true
          checkpoint_limit: 1024

pipeline:
  # One worker serializes the rate counter and the dedupe check (see header).
  threads: 1
  processors:
    # Normalize both decision shapes into one evaluation record. The fast path
    # gets a synthesized fast:<event_id> dedupe key. Invalid payloads (non-object,
    # empty IDs, or neither shape) throw into the catch below; the decisions
    # tables still hold the parsed copies.
    - try:
        - mapping: |
            root = match {
              this.type() != "object" => throw("not a JSON object"),
              (this.schema_version | "") == "" => throw("decision has an empty schema_version"),
              this.decision_id != null && ((this.decision_id | "") == "" || (this.event_id | "") == "") => throw("model decision has an empty decision_id or event_id"),
              this.decision_id != null => {
                "source": "model",
                "event_id": this.event_id,
                "decision_id": this.decision_id,
                "category": null,
                "confidence": null,
                "escalate_probability": this.escalate_probability | 0.0,
                "scam_probability": this.scam_probability | 0.0,
                "degraded": this.degraded | false,
                "decided_at": this.decided_at | now(),
                "schema_version": this.schema_version,
              }
              (this.event_id | "") != "" && this.category != null => {
                "source": "fast",
                "event_id": this.event_id,
                "decision_id": "fast:" + this.event_id,
                "category": this.category,
                "confidence": this.confidence | 0.0,
                "escalate_probability": null,
                "scam_probability": null,
                "degraded": false,
                "decided_at": this.decided_at | now(),
                "schema_version": this.schema_version,
              }
              _ => throw("not a model decision and not a fast decision"),
            }
    - catch:
        - metric:
            type: counter
            name: notify_dropped_total
        - log:
            level: WARN
            message: "notify: invalid decision dropped (${! error() })"
        - mapping: 'root = deleted()'
    # Qualifying rule table (header) — thresholds arrive from the environment
    # at config parse time (compose passes THRESHOLD_*; final values).
    - mapping: |
        root = this
        root.qualifies = match {
          this.degraded == true => false
          this.source == "model" => this.escalate_probability >= (${THRESHOLD_ESCALATE_P}) || this.scam_probability >= (${THRESHOLD_SCAM_P})
          _ => this.category == "scam_report" && this.confidence >= 0.85
        }
    - switch:
        - check: '!(this.qualifies == true)'
          processors:
            - mapping: 'root = deleted()'
    # The record rides in metadata from here: the sql_select below (and any
    # notification HTTP call) replaces the payload, the record is restored
    # after each such step.
    - mapping: 'meta alert_record = this.string()'
    # DEDUPE (see header). Unguarded on purpose: a CH failure must error the
    # message so the output nacks it for redelivery instead of guessing.
    - sql_select:
        driver: clickhouse
        dsn: ${CLICKHOUSE_DSN}
        table: alerts
        columns:
          - count() as n
        where: decision_id = ?
        args_mapping: 'root = [ this.decision_id ]'
    - mapping: |
        root = meta("alert_record").parse_json()
        # dedupe_checked is the "cleared for alerting" marker: every later
        # branch and the output switch require it, so a failed check can never
        # alert, insert, or be acked — it is nacked and redelivered instead.
        # Meta assignments flush at mapping end, so this refreshes the stash
        # for LATER restores only. `root`, not `this` (still the sql_select
        # result array here).
        root.dedupe_checked = this.index(0).n == 0
        meta alert_record = root.string()
    - switch:
        - check: 'this.dedupe_checked == false'
          processors:
            - mapping: 'root = deleted()'
    # RATE LIMIT window counter (drop-and-record — see header); a miss = first
    # alert of this minute → count 0.
    - try:
        - cache:
            resource: rate_window
            key: 'alert-count-${! (timestamp_unix() / 60).floor() }'
            operator: get
    - catch:
        - log:
            level: WARN
            message: "notify: rate counter read failed (${! error() }) — treating as fresh window"
    - catch: []
    # A cache hit replaced the payload with the counter (auto-parsed to a
    # number, not a string) — restore the record and stamp the channel.
    - mapping: |
        let count = match {
          this.type() == "object" => 0.0
          _ => this.number()
        }
        root = match {
          this.type() == "object" => this
          _ => meta("alert_record").parse_json()
        }
        let providers = "${NOTIFY_PROVIDER}"
        root.channel = match {
          $providers.contains("telegram") && $providers.contains("discord") => "telegram,discord"
          $providers.contains("telegram") => "telegram"
          $providers.contains("discord") => "discord"
          $providers.contains("mock") => "mock"
          _ => "log"
        }
        root.rate_count = $count
    - switch:
        # UNDER the limit: consume a slot, deliver, finalize suppressed=false.
        - check: 'this.dedupe_checked == true && this.rate_count < ${ALERT_RATE_LIMIT_PER_MIN}'
          processors:
            - try:
                - cache:
                    resource: rate_window
                    key: 'alert-count-${! (timestamp_unix() / 60).floor() }'
                    operator: set
                    value: '${! (this.rate_count + 1).string() }'
            - catch:
                - log:
                    level: WARN
                    message: "notify: rate counter update failed (${! error() }) — guardrail degraded for this window"
            - catch: []
            # Summary + stash: the POST bodies replace the payload; the
            # finalize step restores from the stash.
            - mapping: |
                root = this
                root.summary = match {
                  this.source == "model" => "[udp/model] event=" + this.event_id + " decision=" + this.decision_id + " escalate_p=" + this.escalate_probability.string() + " scam_p=" + this.scam_probability.string()
                  _ => "[udp/fast] event=" + this.event_id + " decision=" + this.decision_id + " category=" + this.category + " confidence=" + this.confidence.string()
                }
                meta notify_record = this.string()
            # Providers: log / mock / telegram / discord (no-op unless selected).
            - switch:
                - check: '"${NOTIFY_PROVIDER}".contains("log")'
                  processors:
                    - log:
                        level: INFO
                        message: 'notify (log): ${! this.summary }'
                - check: '"${NOTIFY_PROVIDER}".contains("mock")'
                  processors:
                    - mapping: |
                        root = {"event_id": this.event_id, "decision_id": this.decision_id, "source": this.source, "channel": "mock", "suppressed": false, "decided_at": this.decided_at, "created_at": now()}
                    - try:
                        - http:
                            url: ${ALERT_RECEIVER_URL}
                            verb: POST
                            headers:
                              Content-Type: application/json
                            timeout: 3s
                            retries: 2
                            backoff_on:
                              - 429
                              - 503
                            retry_period: 250ms
                    - catch:
                        - metric:
                            type: counter
                            name: notify_delivery_failed_total
                        - log:
                            level: WARN
                            message: "notify: mock delivery failed (${! error() }) — alerts row still written"
                    - catch: []
            - switch:
                - check: '"${NOTIFY_PROVIDER}".contains("telegram")'
                  processors:
                    - mapping: 'root = {"chat_id": "${TELEGRAM_CHAT_ID}", "text": this.summary}'
                    - try:
                        - http:
                            url: https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
                            verb: POST
                            headers:
                              Content-Type: application/json
                            timeout: 3s
                            retries: 2
                            backoff_on:
                              - 429
                              - 503
                            retry_period: 250ms
                    - catch:
                        - metric:
                            type: counter
                            name: notify_delivery_failed_total
                        - log:
                            level: WARN
                            message: "notify: telegram delivery failed (${! error() }) — alerts row still written"
                    - catch: []
            - switch:
                - check: '"${NOTIFY_PROVIDER}".contains("discord")'
                  processors:
                    - mapping: 'root = {"content": this.summary}'
                    - try:
                        - http:
                            url: ${DISCORD_WEBHOOK_URL}
                            verb: POST
                            headers:
                              Content-Type: application/json
                            timeout: 3s
                            retries: 2
                            backoff_on:
                              - 429
                              - 503
                            retry_period: 250ms
                    - catch:
                        - metric:
                            type: counter
                            name: notify_delivery_failed_total
                        - log:
                            level: WARN
                            message: "notify: discord delivery failed (${! error() }) — alerts row still written"
                    - catch: []
            # Finalize the delivered row (restore past the notification POSTs).
            - mapping: |
                root = meta("notify_record").parse_json()
                root.suppressed = false
                root.created_at = now()
        # AT/OVER the limit: drop-and-record — the row is kept with
        # suppressed=true so the alert trail stays complete.
        - check: 'this.dedupe_checked == true && this.rate_count >= ${ALERT_RATE_LIMIT_PER_MIN}'
          processors:
            - metric:
                type: counter
                name: notify_suppressed_total
            - mapping: |
                root = this
                root.suppressed = true
                root.created_at = now()

output:
  # strict_mode nacks anything that never finalized (dedupe-check failure,
  # rate-restore failure) for redelivery. batching count: 1 — the row lands
  # before the input acks, so the dedupe check on any redelivery is current.
  switch:
    strict_mode: true
    cases:
      - check: 'this.dedupe_checked == true && this.suppressed == false'
        output:
          sql_insert:
            driver: clickhouse
            dsn: ${CLICKHOUSE_DSN}
            table: alerts
            columns:
              - decision_id
              - event_id
              - channel
              - suppressed
              - created_at
              - schema_version
            args_mapping: |
              root = [
                this.decision_id,
                this.event_id,
                this.channel,
                false,
                this.created_at.ts_format("2006-01-02 15:04:05.999", "UTC"),
                this.schema_version,
              ]
            batching:
              count: 1
      - check: 'this.dedupe_checked == true && this.suppressed == true'
        output:
          sql_insert:
            driver: clickhouse
            dsn: ${CLICKHOUSE_DSN}
            table: alerts
            columns:
              - decision_id
              - event_id
              - channel
              - suppressed
              - created_at
              - schema_version
            args_mapping: |
              root = [
                this.decision_id,
                this.event_id,
                this.channel,
                true,
                this.created_at.ts_format("2006-01-02 15:04:05.999", "UTC"),
                this.schema_version,
              ]
            batching:
              count: 1

metrics:
  prometheus: {}
