# S3 infra + S4 connect pipelines + S5 model server (profile `model`).
# Notifier (S6) and conduit (S7) are appended by their own subtasks.
# Default stack: `make up` (no model). Real-model stack: `make up-model`.
#
# Pinned images (linux/amd64, verified 2026-10-13):
#   redpandadata/redpanda:v26.2.4             sha256:c98c2f04a751e6646012cc701bac5183252cee44c88ba1dfa412e4c7124f2e89
#   clickhouse/clickhouse-server:26.9.13.15   sha256:04fc72b8a58e58200c706f375ef81ec7112de3515e898de63f6c72843d7a2eeb
#   postgres:16-alpine                        sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
#   redpandadata/console:v3.12.0              sha256:9dc0cd55db172c6be9c2ff8a51f33a14395f7675fa7fbc002c277f3b96115c27
#   redpandadata/connect:4.113.0              sha256:1bdf3246c32985dfef0e4a82e6866f082887a095f9e0e5b778dbe38add70c5d8
#
# Kafka listener layout (single-node dev):
#   PLAINTEXT 29092 — intra-compose clients (console, S4 connect, S7 conduit)
#   EXTERNAL  9092  — host clients, advertised as localhost:9092 so it matches
#                     REDPANDA_BOOTSTRAP. A single PLAINTEXT listener advertised
#                     as redpanda:9092 breaks host producers: after bootstrap the
#                     broker returns redpanda:9092 in metadata, which the host
#                     cannot resolve. Console binds host 8085 (8080 is
#                     qBittorrent's WebUI on this shared homelab box).
#
# Every host port is bound to 127.0.0.1 — this is a shared homelab; nothing here
# is reachable from the LAN. Memory caps: redpanda 1.5G, clickhouse 3G (with a
# 2.5G server-side ceiling), postgres 256m, console 200m, connect 250m each.
# Connect metrics are republished on the host as 4196 (ingest) / 4197 (decide).

name: udp

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 1.5g
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:[[:space:]]*true'"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v26.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        ensure() {
          local t=$$1
          if rpk -X brokers=redpanda:29092 topic describe "$$t" >/dev/null 2>&1; then
            echo "topic exists: $$t"
          else
            rpk -X brokers=redpanda:29092 topic create "$$t" -c cleanup.policy=delete -c retention.ms=604800000
          fi
        }
        ensure tickets
        ensure fast_decisions
        ensure model_decisions
        ensure tickets_dlq
        rpk -X brokers=redpanda:29092 topic list
    networks:
      - udp-net

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.13.15
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-udp-dev-password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-udp}
      # Server-side ceiling (2.5G) below the container cap so CH can never
      # starve the rest of the homelab.
      MAX_SERVER_MEMORY_USAGE_BYTES: "2684354560"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 3g
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udp-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-udp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 256m
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  console:
    image: redpandadata/console:v3.12.0
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      # Env config = uppercased YAML paths (verified on v3.12.0: CONFIG_ prefix
      # is not honoured by this version).
      KAFKA_BROKERS: redpanda:29092
      SERVER_ADDRESS: ":8080"
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8085}:8080"
    mem_limit: 200m
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # S5 — real Laya decision server, joined to the compose network as a
  # container because ufw drops container→host INPUT on this box (a host-run
  # `make model` is otherwise equivalent; see the decide service comment).
  # The GPU is shared (jellyfin): the RX 6600 XT schedules /dev/kfd between
  # processes, and host video/render GIDs (983/987) grant device access.
  # The pinned model runtime is NOT baked into an image — the project .venv
  # (TheRock torch + laya) and the .hf-cache weights are bind-mounted; only
  # PYTHONPATH is pointed at them (the venv's python symlink is host-only).
  # 127.0.0.1:8082 republishes /healthz + /v1/systemone for host-side evals.
  model:
    image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
    profiles: ["model"]
    command: ["python", "-m", "udp.model_server"]
    working_dir: /app
    environment:
      MODEL_HOST: 0.0.0.0
      MODEL_PORT: "8081"
      HF_HOME: /app/.hf-cache
      USE_TF: "0"
      PYTHONPATH: /app/.venv/lib/python3.12/site-packages:/app/src
    volumes:
      - .:/app
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "983" # host video gid (GPU access)
      - "987" # host render gid (GPU access)
    ports:
      - "127.0.0.1:8082:8081" # host-side eval URL; never LAN-exposed
    mem_limit: 5g
    networks:
      - udp-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # S4 — ingest pipeline: tickets → udp.tickets_raw (DLQ: tickets_dlq).
  ingest:
    image: redpandadata/connect:4.113.0
    command: ["run", "/etc/connect/ingest.yaml"]
    volumes:
      - ./connect/ingest.yaml:/etc/connect/ingest.yaml:ro
    environment:
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-admin}:${CLICKHOUSE_PASSWORD:-udp-dev-password}@clickhouse:9000/${CLICKHOUSE_DB:-udp}?dial_timeout=10s
    ports:
      - "127.0.0.1:4196:4195" # /metrics + /ping republished for host curl
    mem_limit: 250m
    networks:
      - udp-net
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4195/ping'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # S4 — decide pipeline: tickets → fast_decisions / model_decisions.
  # MODEL_ENDPOINT_URL defaults at the in-network model server (S5; see the
  # `model` service below). A HOST-run model server (make model) stays
  # selectable via MODEL_ENDPOINT_URL in .env — note that ufw drops
  # container→host traffic on this box, so a host-run server additionally
  # needs `ufw allow from 172.16.0.0/12 to any port 8081 proto tcp`.
  decide:
    image: redpandadata/connect:4.113.0
    command: ["run", "/etc/connect/decide.yaml"]
    volumes:
      - ./connect/decide.yaml:/etc/connect/decide.yaml:ro
    environment:
      MODEL_ENDPOINT_URL: ${MODEL_ENDPOINT_URL:-http://model:8081/v1/systemone}
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-admin}:${CLICKHOUSE_PASSWORD:-udp-dev-password}@clickhouse:9000/${CLICKHOUSE_DB:-udp}?dial_timeout=10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4197:4195" # /metrics + /ping republished for host curl
    mem_limit: 250m
    networks:
      - udp-net
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4195/ping'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  udp-net:
    driver: bridge

volumes:
  redpanda-data:
  clickhouse-data:
  postgres-data:
