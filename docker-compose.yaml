# Infrastructure, Connect pipelines, optional model server (profile `model`),
# and the Conduit bus CDC path (postgres -> pg_changes -> app_users_cdc).
# Default stack: `make up` (no model). Real-model stack: `make up-model`.
#
# Tested images (linux/amd64, verified 2026-10-13). The tags below are used;
# the digests are recorded for pinning a deployment:
#   redpandadata/redpanda:v26.2.4             sha256:c98c2f04a751e6646012cc701bac5183252cee44c88ba1dfa412e4c7124f2e89
#   clickhouse/clickhouse-server:26.9.13.15   sha256:04fc72b8a58e58200c706f375ef81ec7112de3515e898de63f6c72843d7a2eeb
#   postgres:16-alpine                        sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
#   redpandadata/console:v3.12.0              sha256:9dc0cd55db172c6be9c2ff8a51f33a14395f7675fa7fbc002c277f3b96115c27
#   redpandadata/connect:4.113.0              sha256:1bdf3246c32985dfef0e4a82e6866f082887a095f9e0e5b778dbe38add70c5d8
#   ghcr.io/conduitio/conduit:v0.20.0         sha256:e674b7f07d5a0eae98df99521ea81c3b6218ef3e50d724e22797f82e4b778c9a
#
# NOTE: conduitio/conduit NO LONGER EXISTS on Docker Hub (404, 2026-10-13) —
# images are distributed on GitHub Container Registry (ghcr.io/conduitio/conduit,
# see https://conduitdata.io/docs/installing-and-running). v0.20.0 is the first
# stable release with the SEV-0 Postgres snapshot→CDC stall fixed (present in
# v0.19.0); it ships builtin postgres + kafka connectors, and /healthz lives on
# the HTTP API port 8080 (8084 is the gRPC API).
#
# Kafka listener layout (single-node dev):
#   PLAINTEXT 29092 — intra-compose clients (console, connect, conduit)
#   EXTERNAL  9092  — host clients, advertised as localhost:9092 so it matches
#                     REDPANDA_BOOTSTRAP. A single PLAINTEXT listener advertised
#                     as redpanda:9092 breaks host producers: after bootstrap the
#                     broker returns redpanda:9092 in metadata, which the host
#                     cannot resolve. Console binds host 8085 (8080 is
#                     qBittorrent's WebUI on this shared homelab box).
#
# Every host port is bound to 127.0.0.1 — this is a shared homelab; nothing here
# is reachable from the LAN. Memory caps: redpanda 1.5G, clickhouse 3G (with a
# 2.5G server-side ceiling), postgres 256m, console 200m, connect 250m each,
# conduit 250m.
# Connect metrics are republished on the host as 4196 (ingest) / 4197 (decide).

name: udp

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: 1.5g
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:[[:space:]]*true'"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v26.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        ensure() {
          local t=$$1
          # One partition on every dev topic. `pg_changes` needs it: the cdc
          # pipeline dedupes on the Kafka offset, which is a total order only
          # inside one partition.
          if rpk -X brokers=redpanda:29092 topic describe "$$t" >/dev/null 2>&1; then
            echo "topic exists: $$t"
          else
            rpk -X brokers=redpanda:29092 topic create "$$t" -p 1 -c cleanup.policy=delete -c retention.ms=604800000
          fi
        }
        ensure tickets
        ensure fast_decisions
        ensure model_decisions
        ensure tickets_dlq
        ensure pg_changes
        ensure pg_changes_dlq
        rpk -X brokers=redpanda:29092 topic list
    networks:
      - udp-net

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.13.15
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-udp-dev-password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-udp}
      # Server-side ceiling (2.5G) below the container cap so CH can never
      # starve the rest of the homelab.
      MAX_SERVER_MEMORY_USAGE_BYTES: "2684354560"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/cdc.sql:/docker-entrypoint-initdb.d/cdc.sql:ro # CDC mirror
    mem_limit: 3g
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    # Conduit's postgres source runs in logrepl CDC mode, which needs
    # logical decoding: SHOW wal_level must return `logical` (default is
    # `replica`). Verified 2026-10-13.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udp-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-udp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 256m
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  console:
    image: redpandadata/console:v3.12.0
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      # Env config = uppercased YAML paths (verified on v3.12.0: CONFIG_ prefix
      # is not honoured by this version).
      KAFKA_BROKERS: redpanda:29092
      SERVER_ADDRESS: ":8080"
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8085}:8080"
    mem_limit: 200m
    networks:
      - udp-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Real Laya decision server, joined to the compose network as a
  # container because ufw drops container→host INPUT on this box (a host-run
  # `make model` is otherwise equivalent; see the decide service comment).
  # The GPU is shared (jellyfin): the RX 6600 XT schedules /dev/kfd between
  # processes, and host video/render GIDs (983/987) grant device access.
  # The pinned model runtime is NOT baked into an image — the project .venv
  # (TheRock torch + laya) and the .hf-cache weights are bind-mounted; only
  # PYTHONPATH is pointed at them (the venv's python symlink is host-only).
  # 127.0.0.1:8082 republishes /healthz + /v1/systemone for host-side evals.
  model:
    image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
    profiles: ["model"]
    command: ["python", "-m", "udp.model_server"]
    working_dir: /app
    environment:
      MODEL_HOST: 0.0.0.0
      MODEL_PORT: "8081"
      HF_HOME: /app/.hf-cache
      USE_TF: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/.venv/lib/python3.12/site-packages:/app/src
    volumes:
      - ./src:/app/src:ro
      - ./.venv:/app/.venv:ro
      - ./.hf-cache:/app/.hf-cache
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "983" # host video gid (GPU access)
      - "987" # host render gid (GPU access)
    ports:
      - "127.0.0.1:8082:8081" # host-side eval URL; never LAN-exposed
    mem_limit: 5g
    networks:
      - udp-net
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  # Ingest pipeline: tickets → udp.tickets_raw (DLQ: tickets_dlq).
  ingest:
    image: redpandadata/connect:4.113.0
    command: ["run", "/etc/connect/ingest.yaml"]
    volumes:
      - ./connect/ingest.yaml:/etc/connect/ingest.yaml:ro
    environment:
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-admin}:${CLICKHOUSE_PASSWORD:-udp-dev-password}@clickhouse:9000/${CLICKHOUSE_DB:-udp}?dial_timeout=10s
    ports:
      - "127.0.0.1:4196:4195" # /metrics + /ping republished for host curl
    mem_limit: 250m
    networks:
      - udp-net
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4195/ping'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Decide pipeline: tickets → fast_decisions / model_decisions.
  # MODEL_ENDPOINT_URL defaults at the in-network model server (see the
  # `model` service below). A HOST-run model server (make model) stays
  # selectable via MODEL_ENDPOINT_URL in .env — note that ufw drops
  # container→host traffic on this box, so a host-run server additionally
  # needs `ufw allow from 172.16.0.0/12 to any port 8081 proto tcp`.
  decide:
    image: redpandadata/connect:4.113.0
    command: ["run", "/etc/connect/decide.yaml"]
    volumes:
      - ./connect/decide.yaml:/etc/connect/decide.yaml:ro
    environment:
      MODEL_ENDPOINT_URL: ${MODEL_ENDPOINT_URL:-http://model:8081/v1/systemone}
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-admin}:${CLICKHOUSE_PASSWORD:-udp-dev-password}@clickhouse:9000/${CLICKHOUSE_DB:-udp}?dial_timeout=10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4197:4195" # /metrics + /ping republished for host curl
    mem_limit: 250m
    networks:
      - udp-net
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4195/ping'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Notify pipeline: fast_decisions + model_decisions → udp.alerts
  # (+ delivery per NOTIFY_PROVIDER; log = safe default with no receiver,
  # compose.mock.yaml switches it to the mock alert receiver).
  notify:
    image: redpandadata/connect:4.113.0
    command: ["run", "/etc/connect/notify.yaml"]
    volumes:
      - ./connect/notify.yaml:/etc/connect/notify.yaml:ro
    environment:
      NOTIFY_PROVIDER: ${NOTIFY_PROVIDER:-log}
      ALERT_RECEIVER_URL: ${ALERT_RECEIVER_URL:-http://alert-receiver:8082/alerts}
      ALERT_RATE_LIMIT_PER_MIN: ${ALERT_RATE_LIMIT_PER_MIN:-10}
      THRESHOLD_ESCALATE_P: ${THRESHOLD_ESCALATE_P:-0.75}
      THRESHOLD_SCAM_P: ${THRESHOLD_SCAM_P:-0.35}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-admin}:${CLICKHOUSE_PASSWORD:-udp-dev-password}@clickhouse:9000/${CLICKHOUSE_DB:-udp}?dial_timeout=10s
    ports:
      - "127.0.0.1:4198:4195" # /metrics + /ping republished for host curl
    mem_limit: 250m
    networks:
      - udp-net
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4195/ping'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Conduit bus CDC: Postgres snapshot + WAL (logical replication) →
  # topic `pg_changes` (OpenCDC json records: payload.before/after, op).
  # Checkpoints (source position incl. replication slot) persist in the
  # `conduit-data` badger volume, so restarts resume without re-snapshotting.
  # In-network only: no host ports; host observers use the cdc pipeline's
  # ClickHouse landing (or `docker compose exec conduit wget -qO- :8080/healthz`).
  conduit:
    image: ghcr.io/conduitio/conduit:v0.20.0@sha256:e674b7f07d5a0eae98df99521ea81c3b6218ef3e50d724e22797f82e4b778c9a
    command:
      - /app/conduit
      - run
      - --pipelines.path
      - /etc/conduit/pipelines
      - --db.badger.path
      - /data/conduit.db
    volumes:
      - ./conduit/conduit.yaml:/etc/conduit/pipelines/conduit.yaml:ro
      - conduit-data:/data
    mem_limit: 250m
    networks:
      - udp-net
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      # /healthz (liveness) is on the HTTP API :8080; :8084 is gRPC-only.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/healthz'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # CDC pipeline: topic `pg_changes` (conduit's OpenCDC records) →
  # udp.app_users_cdc. Reads every change op; current-state dedupe is
  # read-time (argMax per id keyed on the kafka offset, latest op wins,
  # op='d' ids excluded — see clickhouse/cdc.sql).
  cdc:
    image: redpandadata/connect:4.113.0
    command: ["run", "/etc/connect/cdc.yaml"]
    volumes:
      - ./connect/cdc.yaml:/etc/connect/cdc.yaml:ro
    environment:
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER:-admin}:${CLICKHOUSE_PASSWORD:-udp-dev-password}@clickhouse:9000/${CLICKHOUSE_DB:-udp}?dial_timeout=10s
    ports:
      - "127.0.0.1:4199:4195" # /metrics + /ping republished for host curl
    mem_limit: 250m
    networks:
      - udp-net
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      conduit:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4195/ping'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  udp-net:
    driver: bridge

volumes:
  redpanda-data:
  clickhouse-data:
  postgres-data:
  conduit-data:
